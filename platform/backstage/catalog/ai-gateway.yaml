apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ai-gateway
  title: AI Gateway
  description: >
    Unified model endpoint with routing, rate limiting, exact-prompt caching, and
    per-application usage tracking. All application teams call this service instead
    of model providers directly.
  tags:
    - ai-platform
    - gateway
    - production-ready
  links:
    - url: http://localhost:8080
      title: Local Development Endpoint
    - url: http://localhost:8080/health
      title: Health Check
    - url: http://localhost:8080/metrics
      title: Usage Metrics
  annotations:
    backstage.io/techdocs-ref: dir:.
spec:
  type: service
  lifecycle: production
  owner: group:platform-team
  system: ai-platform
  providesApis:
    - ai-gateway-api
  dependsOn:
    - component:project-01-model-api
