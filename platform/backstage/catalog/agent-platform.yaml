apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: agent-platform
  title: Agent Platform
  description: >
    Safe agent runtime with a tool registry, authorization checks, and
    approval gates for destructive actions. Agents can query the RAG platform,
    retrieve gateway metrics, and manage RAG services — all through an audited
    execution path with per-run artifacts.
  tags:
    - ai-platform
    - agents
    - tool-execution
    - production-ready
  links:
    - url: http://localhost:8091
      title: Local Development Endpoint
    - url: http://localhost:8091/tools
      title: Tool Registry
  annotations:
    backstage.io/techdocs-ref: dir:.
spec:
  type: service
  lifecycle: production
  owner: group:platform-team
  system: ai-platform
  providesApis:
    - agent-platform-api
  dependsOn:
    - component:rag-platform
    - component:ai-gateway
