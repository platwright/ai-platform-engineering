apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-api
  template:
    metadata:
      labels:
        app: model-api
    spec:
      containers:
        - name: model-api
          image: aipe/project-01-model-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_API_URL
              valueFrom:
                secretKeyRef:
                  name: openai-compatible-provider
                  key: MODEL_API_URL
                  optional: true
            - name: MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-compatible-provider
                  key: MODEL_API_KEY
                  optional: true
            - name: MODEL_NAME
              valueFrom:
                secretKeyRef:
                  name: openai-compatible-provider
                  key: MODEL_NAME
                  optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
