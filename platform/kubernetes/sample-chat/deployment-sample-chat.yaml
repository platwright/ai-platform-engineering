apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-chat
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-chat
  template:
    metadata:
      labels:
        app: sample-chat
    spec:
      containers:
        - name: sample-chat
          image: aipe/sample-chat:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: sample-chat-config
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi