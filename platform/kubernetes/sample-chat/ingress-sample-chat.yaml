apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sample-chat
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  rules:
    - host: sample-chat.local
      http:
        paths:
          - path: /api/chat
            pathType: Prefix
            backend:
              service:
                name: sample-chat
                port:
                  number: 8080
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: sample-chat
                port:
                  number: 8080