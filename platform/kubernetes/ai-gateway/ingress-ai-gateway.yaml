apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-gateway
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  rules:
    - host: ai-gateway.local
      http:
        paths:
          - path: /api/chat
            pathType: Prefix
            backend:
              service:
                name: ai-gateway
                port:
                  number: 8090
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: ai-gateway
                port:
                  number: 8090
