apiVersion: v1
kind: Pod
metadata:
  name: gpu-smoke-check
spec:
  restartPolicy: Never
  nodeSelector:
    accelerator: nvidia
  tolerations:
    - key: dedicated
      operator: Equal
      value: gpu
      effect: NoSchedule
  containers:
    - name: cuda-smoke-check
      image: nvidia/cuda:12.4.1-base-ubuntu22.04
      command:
        - bash
        - -lc
        - nvidia-smi || true
      resources:
        limits:
          nvidia.com/gpu: "1"
