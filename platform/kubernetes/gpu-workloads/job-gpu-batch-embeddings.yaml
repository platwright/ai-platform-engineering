apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-batch-embeddings-example
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        accelerator: nvidia
      tolerations:
        - key: dedicated
          operator: Equal
          value: gpu
          effect: NoSchedule
      containers:
        - name: batch-embeddings
          image: python:3.11-slim
          command:
            - python
            - -c
            - print('Placeholder for GPU batch embeddings job')
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "2"
              memory: 4Gi
              nvidia.com/gpu: "1"